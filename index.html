<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>予約フォーム</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f4f6f8;}
    .container{max-width:340px;margin:0 auto;padding:24px;}
    .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:24px;position:relative;}
    h2{margin:0 0 24px;font-size:18px;text-align:center;}
    .close-btn{position:absolute;top:12px;right:12px;border:none;background:transparent;font-size:20px;cursor:pointer;display:none;}
    label{display:block;margin:0 0 12px;font-size:14px;font-weight:600;}
    input,select{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:6px;background:#eee;font-size:15px;}
    .submit-btn{margin-top:24px;width:100%;padding:14px 0;border:none;border-radius:8px;font-size:15px;font-weight:700;color:#fff;background:#00C300;cursor:pointer;transition:opacity .2s;}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
    .policy-link{display:block;margin-top:8px;font-size:12px;color:#0056ff;text-decoration:underline;}
    .spinner-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 6px solid #eee;
      border-top: 6px solid #00C300;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .complete-message {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .complete-content {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      min-width: 260px;
      max-width: 90vw;
      margin-left: 16px;
      margin-right: 16px;
    }
    @media (max-width: 480px) {
      .complete-content {
        padding: 24px 8vw;
        margin-left: 4vw;
        margin-right: 4vw;
      }
    }
    .complete-title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .complete-detail {
      font-size: 1em;
      margin-bottom: 8px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <button class="close-btn" aria-label="閉じる">✕</button>
      <h2>進学相談会 予約フォーム</h2>
      <div id="loadingSpinner" class="spinner-overlay" style="display:none;">
        <div class="spinner"></div>
      </div>
      <div id="completeMessage" class="complete-message" style="display:none;">
        <div class="complete-content">
          <div class="complete-title">予約が完了しました！</div>
          <div id="completeDetail" class="complete-detail"></div>
          <button id="completeOkBtn" class="submit-btn" style="margin-top:24px;">OK</button>
        </div>
      </div>
      <form id="reserveForm">
        <label>姓（苗字）
          <input type="text" name="familyName" placeholder="山田" required>
        </label>
        <label>名（名前）
          <input type="text" name="firstName" placeholder="花子" required>
        </label>
        <label>学校名
          <input type="text" name="schoolName" placeholder="〇〇高等学校" required>
        </label>
        <label>学年
          <select name="schoolGrade" required>
            <option value="" hidden disabled selected>選択してください</option>
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
          </select>
        </label>
        <label>質問・備考
          <textarea name="question" rows="3" placeholder="ご質問やご要望があればご記入ください（任意）"></textarea>
        </label>
        <a href="https://example.com/privacy" target="_blank" class="policy-link">プライバシーポリシーについて</a>
        <button class="submit-btn" type="submit" id="submitBtn">
          プライバシーポリシーに<br>同意して予約する
        </button>
      </form>
    </div>
  </div>
  <script>
    // API エンドポイント定数
    //const API_ENDPOINT = 'https://homepc.gamebox777.work/api/miniapp-api/reservations';
    const API_ENDPOINT = 'https://port7071.gamebox777.work/api/miniapp-api/reservations';

    // LIFF設定
    const LIFF_ID = '2007366489-ZaL835MB'; // 入力フォーム (Full)
    const ENABLE_TEST_MODE = false; // 本番用設定
    
    // LIFF初期化状態管理
    let liffReady = false;
    
    // デバッグ用：LINE環境でもログを確認できるように
    let debugLogs = [];
    function debugLog(message, data = null) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = `[${timestamp}] ${message}`;
      debugLogs.push(logEntry);
      console.log(logEntry, data);
      
      // デバッグログを画面に表示するオプション
      if (window.showDebugLogs) {
        updateDebugDisplay();
      }
    }
    
    function updateDebugDisplay() {
      let debugDiv = document.getElementById('debugDisplay');
      if (!debugDiv) {
        debugDiv = document.createElement('div');
        debugDiv.id = 'debugDisplay';
        debugDiv.style.cssText = `
          position: fixed; top: 10px; right: 10px; 
          background: rgba(0,0,0,0.8); color: white; 
          padding: 10px; font-size: 10px; 
          max-width: 200px; max-height: 300px; 
          overflow: auto; z-index: 99999;
          border-radius: 5px; display: none;
        `;
        document.body.appendChild(debugDiv);
      }
      debugDiv.innerHTML = debugLogs.slice(-20).join('<br>');
      debugDiv.style.display = 'block';
    }
    
    // デバッグ表示の切り替え（3回タップで表示）
    let tapCount = 0;
    document.addEventListener('click', () => {
      tapCount++;
      setTimeout(() => { tapCount = 0; }, 2000);
      if (tapCount >= 3) {
        window.showDebugLogs = !window.showDebugLogs;
        const debugDiv = document.getElementById('debugDisplay');
        if (debugDiv) {
          debugDiv.style.display = window.showDebugLogs ? 'block' : 'none';
        }
        if (window.showDebugLogs) updateDebugDisplay();
        tapCount = 0;
      }
    });

    // LIFF初期化
    async function initializeLiff() {
      debugLog('=== LIFF初期化開始 ===');
      debugLog('LIFF_ID: ' + LIFF_ID);
      debugLog('liff オブジェクト存在確認: ' + (typeof liff !== 'undefined'));
      
      try {
        debugLog('liff.init() 呼び出し中...');
        await liff.init({ liffId: LIFF_ID });
        debugLog('liff.init() 完了');
        
        // 初期化状態の詳細チェック
        debugLog('LIFF詳細状態:');
        debugLog('- liff.isReady(): ' + (liff.isReady ? liff.isReady() : 'isReady関数なし'));
        debugLog('- liff.isInClient(): ' + (liff.isInClient ? liff.isInClient() : 'isInClient関数なし'));
        debugLog('- liff.isLoggedIn(): ' + (liff.isLoggedIn ? liff.isLoggedIn() : 'isLoggedIn関数なし'));
        
        liffReady = true;
        debugLog('✅ LIFF初期化成功');
        
        // 初期化完了後にボタンを有効化
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'プライバシーポリシーに<br>同意して予約する';
          debugLog('送信ボタン有効化完了');
        }
        
        // ユーザー情報も取得してみる
        try {
          if (liff.isLoggedIn && liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            debugLog('LINEユーザー情報取得成功: ' + profile.displayName);
          }
        } catch (profileError) {
          debugLog('ユーザー情報取得エラー: ' + profileError.message);
        }
        
      } catch (error) {
        debugLog('❌ LIFF初期化エラー: ' + error.message);
        debugLog('エラー詳細: ' + error.name + ' - ' + error.message);
        liffReady = false;
        
        // エラー時のボタン状態更新
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '❌ LIFF初期化失敗<br>3回タップでログ表示<br>再読み込みしてください';
        }
        
        // エラー時はデバッグ表示を自動で有効化
        window.showDebugLogs = true;
        updateDebugDisplay();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // 初期状態ではボタンを無効化
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'LIFF初期化中...<br>お待ちください';
      }
      
      // LIFF初期化を実行
      initializeLiff();
    });
    
    // URLパラメータからtokenを取得しhiddenでセット
    const p     = new URLSearchParams(location.search);
    const token = p.get('tok') ?? '';
    document.addEventListener('DOMContentLoaded', () => {
      const tokenInput = document.createElement('input');
      tokenInput.type = 'hidden';
      tokenInput.name = 'token';
      tokenInput.value = token;
      document.getElementById('reserveForm').appendChild(tokenInput);
    });
    // フォーム送信
    const form   = document.getElementById('reserveForm');
    const button = document.getElementById('submitBtn');
    const spinner = document.getElementById('loadingSpinner');
    const completeMessage = document.getElementById('completeMessage');
    const completeDetail = document.getElementById('completeDetail');
    const completeOkBtn = document.getElementById('completeOkBtn');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      button.disabled = true;
      spinner.style.display = 'flex'; // スピナー表示
      const startTime = Date.now();
      console.log('送信ボタン押下:', new Date(startTime).toISOString());
      
      try {
        // フォームデータを収集（キモチAPI形式）
        const reservationData = {
          family_name: form.familyName.value.trim(),
          first_name: form.firstName.value.trim(),
          school_name: form.schoolName.value.trim(),
          school_grade: parseInt(form.schoolGrade.value),
          question: form.question?.value.trim() || ''
        };

        // バリデーション
        if (!reservationData.family_name || !reservationData.first_name || 
            !reservationData.school_name || !reservationData.school_grade) {
          throw new Error('必須項目を入力してください');
        }

        console.log('[送信データ]', reservationData);

        const endTime = Date.now();
        const elapsed = ((endTime - startTime) / 1000).toFixed(2);
        
        completeDetail.textContent = '予約データを準備しました。キモチAPIに送信中...';
        completeMessage.style.display = 'flex';
        
        // 詳細なLIFF状態確認
        debugLog('=== 送信時LIFF状態チェック ===');
        debugLog('- liff定義済み: ' + (typeof liff !== 'undefined'));
        debugLog('- liffReady フラグ: ' + liffReady);
        
        if (typeof liff !== 'undefined') {
          console.log('- liff.isReady存在:', typeof liff.isReady === 'function');
          console.log('- liff.isReady()結果:', liff.isReady ? liff.isReady() : 'N/A');
          console.log('- liff.isInClient存在:', typeof liff.isInClient === 'function');
          console.log('- liff.isInClient()結果:', liff.isInClient ? liff.isInClient() : 'N/A');
          console.log('- liff.sendMessages存在:', typeof liff.sendMessages === 'function');
        } else {
          console.error('liffオブジェクトが未定義です！LIFF SDKの読み込みに失敗している可能性があります。');
        }
        
        try {
          // より柔軟な条件チェック
          const liffInitialized = liffReady && (typeof liff !== 'undefined') && liff.isReady && liff.isReady();
          console.log('LIFF初期化完了判定:', liffInitialized);
          
          if (liffInitialized) {
            const inClient = liff.isInClient && liff.isInClient();
            debugLog('LINEクライアント内判定: ' + inClient);
            
            if (inClient) {
              debugLog('✅ キモチAPI予約送信開始...');
              
              // 予約データをJSON文字列化してURLエンコード
              const reservationJson = encodeURIComponent(JSON.stringify(reservationData));
              debugLog('エンコード済み予約データ（最初の100文字）: ' + reservationJson.substring(0, 100) + '...');
              
              // admissionHandler.jsにテキストメッセージとして送信
              const message = `reservation_submit:${reservationJson}`;
              debugLog('送信メッセージ長: ' + message.length);
              
              await liff.sendMessages([{
                type: 'text',
                text: message
              }]);
              
              debugLog('✅ 予約データ送信完了');
              completeDetail.textContent = '✅ 予約データを送信しました！\n\nLINEトーク画面で予約内容の確認と結果をお待ちください。\n\nアプリを自動で閉じます...';
            } else {
              debugLog('⚠️ LINEクライアント外環境です');
              completeDetail.textContent = '⚠️ LINEアプリ内で開いてください。\n\nLINEアプリのトーク画面から再度お試しください。';
            }
          } else {
            debugLog('❌ LIFF未初期化状態');
            debugLog('詳細状況:');
            debugLog('- liffReady: ' + liffReady);
            debugLog('- liff存在: ' + (typeof liff !== 'undefined'));
            debugLog('- liff.isReady存在: ' + (typeof liff !== 'undefined' && typeof liff.isReady === 'function'));
            debugLog('- liff.isReady(): ' + (typeof liff !== 'undefined' && liff.isReady ? liff.isReady() : 'N/A'));
            
            let errorDetail = 'LIFF初期化が完了していません。\n\n原因：\n';
            if (!liffReady) {
              errorDetail += '• LIFF初期化処理でエラーが発生\n';
            }
            if (typeof liff === 'undefined') {
              errorDetail += '• LIFF SDKの読み込み失敗\n';
            } else if (!liff.isReady || !liff.isReady()) {
              errorDetail += '• LIFF readyステートになっていない\n';
            }
            errorDetail += '\n対処法：\n• ページを再読み込みしてください\n• LINEアプリを再起動してください';
            
            completeDetail.textContent = errorDetail;
          }
        } catch (messageError) {
          console.log('予約送信エラー:', messageError);
          throw new Error('予約送信エラー: ' + messageError.message);
        }
        
        // 3秒後にLIFFアプリを自動で閉じる
        setTimeout(() => {
          try {
            if (liffReady && liff.isInClient()) {
              liff.closeWindow();
            } else {
              console.log('LIFF環境ではありません（自動クローズなし）');
            }
          } catch (error) {
            console.log('ウィンドウクローズエラー:', error);
          }
        }, 3000);
        
      } catch(err){
        let errorMessage = '予約送信に失敗しました。\n\n';
        errorMessage += '[エラー詳細]\n' + (err.message || 'Unknown error') + '\n\n';
        errorMessage += 'もう一度お試しください。';
        alert(errorMessage);
        button.disabled = false;
        completeMessage.style.display = 'none';
      }
      spinner.style.display = 'none'; // スピナー非表示
    });
    completeOkBtn.addEventListener('click', () => {
      try {
        if (liffReady && liff.isInClient()) {
          liff.closeWindow();
        } else {
          completeMessage.style.display = 'none';
        }
      } catch (error) {
        console.log('ウィンドウクローズエラー:', error);
        completeMessage.style.display = 'none';
      }
    });
  </script>
</body>
</html>
