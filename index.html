<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>予約フォーム</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 開発用設定
    const DEV_MODE = false; // true: テストデータ表示, false: プレースホルダー表示
    const TEST_DATA = {
      familyName: '山田',
      firstName: '花子',
      familyNameKana: 'ヤマダ',
      firstNameKana: 'ハナコ',
      school: '〇〇高校',
      grade: '2'
    };
  </script>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f4f6f8;}
    .container{max-width:340px;margin:0 auto;padding:24px;}
    .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:24px;position:relative;}
    h2{margin:0 0 24px;font-size:18px;text-align:center;}
    .close-btn{position:absolute;top:12px;right:12px;border:none;background:transparent;font-size:20px;cursor:pointer;display:none;}
    label{display:block;margin:0 0 12px;font-size:14px;font-weight:600;}
    input,select{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:6px;background:#eee;font-size:15px;}
    .submit-btn{margin-top:24px;width:100%;padding:14px 0;border:none;border-radius:8px;font-size:15px;font-weight:700;color:#fff;background:#00C300;cursor:pointer;transition:opacity .2s;}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
    .policy-link{display:block;margin-top:8px;font-size:12px;color:#0056ff;text-decoration:underline;}

    .spinner-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 6px solid #eee;
      border-top: 6px solid #00C300;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .complete-message {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .complete-content {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      min-width: 260px;
      max-width: 90vw;
      margin-left: 16px;
      margin-right: 16px;
    }
    @media (max-width: 480px) {
      .complete-content {
        padding: 24px 8vw;
        margin-left: 4vw;
        margin-right: 4vw;
      }
    }
    .complete-title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .complete-detail {
      font-size: 1em;
      margin-bottom: 8px;
      color: #333;
    }
    .api-endpoint-info {
      font-size: 0.7em;
      color: #666;
      margin-top: 4px;
      margin-bottom: 16px;
      word-break: break-all;
      line-height: 1.2;
    }

    /* === 学校名サジェスト === */
    .suggest-wrap{position:relative}
    .suggest-list{
      position:absolute; left:0; right:0; top:100%;
      background:#fff; border:1px solid #e0e0e0; border-top:none;
      border-radius:0 0 8px 8px; box-shadow:0 4px 12px rgba(0,0,0,.06);
      max-height:240px; overflow:auto; z-index:1000; display:none;
    }
    .suggest-item{padding:10px 12px; cursor:pointer; font-size:14px; line-height:1.3}
    .suggest-item:hover,.suggest-item[aria-selected="true"]{background:#f0f7ff}
    .suggest-empty{padding:10px 12px; color:#888; font-size:12px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <button class="close-btn" aria-label="閉じる">✕</button>
      <h2>予約フォーム</h2>
      <div id="loadingSpinner" class="spinner-overlay" style="display:none;">
        <div class="spinner"></div>
      </div>
      <div id="completeMessage" class="complete-message" style="display:none;">
        <div class="complete-content">
          <div class="complete-title">予約が完了しました！</div>
          <div id="completeDetail" class="complete-detail"></div>
          <button id="completeOkBtn" class="submit-btn" style="margin-top:24px;">OK</button>
        </div>
      </div>
      <form id="reserveForm">
        <label>姓
          <input type="text" name="familyName" id="familyName" required>
        </label>
        <label>名
          <input type="text" name="firstName" id="firstName" required>
        </label>
        <label>セイ（ヨミガナ）
          <input type="text" name="familyNameKana" id="familyNameKana" required>
        </label>
        <label>メイ（ヨミガナ）
          <input type="text" name="firstNameKana" id="firstNameKana" required>
        </label>
        <!-- 学校名入力欄（サジェスト対応） -->
        <label>学校名
          <div class="suggest-wrap">
            <input type="text" name="school" id="school" required autocomplete="off"
                   aria-autocomplete="list" aria-expanded="false" aria-owns="schoolSuggest">
            <div id="schoolSuggest" class="suggest-list" role="listbox"></div>
          </div>
        </label>
        <label>学年
          <select name="grade" id="grade" required>
            <option value="" hidden disabled selected>選択してください</option>
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
          </select>
        </label>
        <a href="https://example.com/privacy" target="_blank" class="policy-link">プライバシーポリシーについて</a>
        <button class="submit-btn" type="submit" id="submitBtn">
          プライバシーポリシーに<br>同意して予約する
        </button>

        <!-- デバッグ情報 -->
        <div id="apiEndpointInfo" class="api-endpoint-info" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e0e0e0;"></div>
        <div id="versionInfo" class="api-endpoint-info" style="margin-top: 8px; font-size: 0.6em; color: #999;"></div>
      </form>
    </div>
  </div>

  <script>
    /* ============================
     *  ここから既存のフォーム送信処理
     * ============================ */
    const API_ENDPOINT = 'https://port7071.gamebox777.work/api/miniapp-api/reservations';
    const LIFF_ID = '2007366489-ZaL835MB';

    /* ============================
     *  学校名オートコンプリート処理
     * ============================ */
    const SCHOOL_API_BASE   = 'https://api.edu-data.jp/api/v1/school'; // 本番
    const SCHOOL_API_TOKEN  = 'Bearer 437|7UaSUfEx5f67fMXNgofLT5eNa8xZuBuXL07JrWrT'; // ←実際のトークンに置換
    const SUGGEST_LIMIT     = 50;
    const SCHOOL_TYPE_FILTERS = ['D1','D2']; // 高校=D1, 高専=D2

    const schoolInput = document.getElementById('school');
    const suggestBox  = document.getElementById('schoolSuggest');
    let composing = false;
    let currentIndex = -1;
    let lastKeyword = '';

    schoolInput.addEventListener('compositionstart', ()=> composing = true);
    schoolInput.addEventListener('compositionend',   (e)=>{ composing = false; handleInput(e); });

    function debounce(fn, wait=250){let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };}
    const handleInput = debounce(async (e)=>{
      if (composing) return;
      const kw = (e?.target?.value || schoolInput.value).trim();
      if (kw.length < 2){ hideSuggest(); return; }
      if (kw === lastKeyword) return; lastKeyword = kw;
      try{
        const items = await fetchSchools(kw, SUGGEST_LIMIT);
        renderSuggest(items, kw);
      }catch(err){
        console.error('[schools] fetch error', err);
        renderSuggest([], kw, '候補取得失敗');
      }
    },250);
    schoolInput.addEventListener('input', handleInput);

    function renderSuggest(items, keyword, errorText){
      suggestBox.innerHTML = ''; currentIndex = -1;
      if (errorText){suggestBox.innerHTML = `<div class="suggest-empty">${errorText}</div>`;showSuggest();return;}
      if (!items.length){suggestBox.innerHTML = `<div class="suggest-empty">「${keyword}」の候補なし</div>`;showSuggest();return;}
      const frag = document.createDocumentFragment();
      items.slice(0,SUGGEST_LIMIT).forEach((it)=>{
        const disp = [it.school_name,it.pref,it.school_locate_at].filter(Boolean).join(' / ');
        const div=document.createElement('div');
        div.className='suggest-item';div.role='option';
        div.setAttribute('data-name',it.school_name||'');div.setAttribute('data-code',it.school_code||'');
        div.textContent=disp||it.school_name||'';
        div.addEventListener('mousedown',(e)=>{
          e.preventDefault();
          schoolInput.value=it.school_name;
          hideSuggest();
          setSchoolCodeHidden(it.school_code||'');
        });
        frag.appendChild(div);
      });
      suggestBox.appendChild(frag);
      showSuggest();
    }

    function showSuggest(){suggestBox.style.display='block';schoolInput.setAttribute('aria-expanded','true');}
    function hideSuggest(){suggestBox.style.display='none';schoolInput.setAttribute('aria-expanded','false');}

    async function fetchSchools(keyword, limit=50){
      const headers={'Accept':'application/json','Authorization':SCHOOL_API_TOKEN};
      const results=[];
      for(const code of SCHOOL_TYPE_FILTERS){
        let url=new URL(SCHOOL_API_BASE);
        url.searchParams.set('keyword',keyword);
        url.searchParams.set('school_type_code',code);
        while(url && results.length<limit){
          const res=await fetch(url.toString(),{headers});
          if(!res.ok) throw new Error('API error:'+res.status);
          const data=await res.json();
          const pageItems=data?.schools?.data||[];
          results.push(...pageItems);
          const next=data?.schools?.next_page_url;
          url=(next&&results.length<limit)?new URL(next):null;
        }
      }
      return results.slice(0,limit);
    }

    function setSchoolCodeHidden(code){
      let hidden=document.getElementById('schoolCodeHidden');
      if(!hidden){
        hidden=document.createElement('input');
        hidden.type='hidden';
        hidden.name='schoolCode';
        hidden.id='schoolCodeHidden';
        document.getElementById('reserveForm').appendChild(hidden);
      }
      hidden.value=code||'';
    }
  </script>
</body>
</html>
