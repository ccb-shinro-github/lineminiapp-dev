<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>予約フォーム</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 開発用設定
    const DEV_MODE = true; // true: テストデータ表示, false: プレースホルダー表示
    const TEST_DATA = {
      familyName: '山田',
      firstName: '花子',
      familyNameKana: 'ヤマダ',
      firstNameKana: 'ハナコ',
      school: '〇〇高校',
      grade: '2'
    };
  </script>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f4f6f8;}
    .container{max-width:340px;margin:0 auto;padding:24px;}
    .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:24px;position:relative;}
    h2{margin:0 0 24px;font-size:18px;text-align:center;}
    .close-btn{position:absolute;top:12px;right:12px;border:none;background:transparent;font-size:20px;cursor:pointer;display:none;}
    label{display:block;margin:0 0 12px;font-size:14px;font-weight:600;}
    input,select{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:6px;background:#eee;font-size:15px;}
    .submit-btn{margin-top:24px;width:100%;padding:14px 0;border:none;border-radius:8px;font-size:15px;font-weight:700;color:#fff;background:#00C300;cursor:pointer;transition:opacity .2s;}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
    .policy-link{display:block;margin-top:8px;font-size:12px;color:#0056ff;text-decoration:underline;}
    .spinner-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 6px solid #eee;
      border-top: 6px solid #00C300;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .complete-message {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .complete-content {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      min-width: 260px;
      max-width: 90vw;
      margin-left: 16px;
      margin-right: 16px;
    }
    @media (max-width: 480px) {
      .complete-content {
        padding: 24px 8vw;
        margin-left: 4vw;
        margin-right: 4vw;
      }
    }
    .complete-title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .complete-detail {
      font-size: 1em;
      margin-bottom: 8px;
      color: #333;
    }
    .api-endpoint-info {
      font-size: 0.7em;
      color: #666;
      margin-top: 4px;
      margin-bottom: 16px;
      word-break: break-all;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <button class="close-btn" aria-label="閉じる">✕</button>
      <h2>予約フォーム</h2>
      <div id="loadingSpinner" class="spinner-overlay" style="display:none;">
        <div class="spinner"></div>
      </div>
      <div id="completeMessage" class="complete-message" style="display:none;">
        <div class="complete-content">
          <div class="complete-title">予約が完了しました！</div>
          <div id="completeDetail" class="complete-detail"></div>
          <button id="completeOkBtn" class="submit-btn" style="margin-top:24px;">OK</button>
        </div>
      </div>
      <form id="reserveForm">
        <label>姓
          <input type="text" name="familyName" id="familyName" required>
        </label>
        <label>名
          <input type="text" name="firstName" id="firstName" required>
        </label>
        <label>セイ（ヨミガナ）
          <input type="text" name="familyNameKana" id="familyNameKana" required>
        </label>
        <label>メイ（ヨミガナ）
          <input type="text" name="firstNameKana" id="firstNameKana" required>
        </label>
        <label>学校名
          <input type="text" name="school" id="school" required>
        </label>
        <label>学年
          <select name="grade" id="grade" required>
            <option value="" hidden disabled selected>選択してください</option>
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
          </select>
        </label>
        <a href="https://example.com/privacy" target="_blank" class="policy-link">プライバシーポリシーについて</a>
        <button class="submit-btn" type="submit" id="submitBtn">
          プライバシーポリシーに<br>同意して予約する
        </button>
        
        <!-- デバッグ情報 -->
        <div id="apiEndpointInfo" class="api-endpoint-info" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e0e0e0;"></div>
        <div id="versionInfo" class="api-endpoint-info" style="margin-top: 8px; font-size: 0.6em; color: #999;"></div>
      </form>
    </div>
  </div>
  <script>
    // 環境判定とAPI エンドポイント設定
    function getApiEndpoint() {
      const currentHost = window.location.hostname;
      const envParam = new URLSearchParams(window.location.search).get('env');

      // クエリでの明示指定を最優先
      if (envParam) {
        const normalized = envParam.toLowerCase();
        if (normalized === 'stg' || normalized === 'staging') {
          return 'https://linebot-kimochipj-staging-azb3bnfahabahgd8.japaneast-01.azurewebsites.net/api/miniapp-api/reservations';
        }
        if (normalized === 'dev' || normalized === 'development') {
          return 'https://port7071.gamebox777.work/api/miniapp-api/reservations';
        }
        if (normalized === 'prod' || normalized === 'production') {
          return 'https://linebot-kimochipj-prod-azb3bnfahabahgd8.japaneast-01.azurewebsites.net/api/miniapp-api/reservations';
        }
      }

      // ホスト名での自動判定（後方互換）
      if (currentHost.includes('staging') || currentHost.includes('azurewebsites.net')) {
        return 'https://linebot-kimochipj-staging-azb3bnfahabahgd8.japaneast-01.azurewebsites.net/api/miniapp-api/reservations';
      }
      if (currentHost.includes('production') || currentHost.includes('prod')) {
        return 'https://linebot-kimochipj-prod-azb3bnfahabahgd8.japaneast-01.azurewebsites.net/api/miniapp-api/reservations';
      }

      // 既定: 開発環境
      return 'https://port7071.gamebox777.work/api/miniapp-api/reservations';
    }
    
    const API_ENDPOINT = getApiEndpoint();
    console.log('🌐 使用するAPI_ENDPOINT:', API_ENDPOINT);
    
    // APIエンドポイント情報を画面に表示
    document.addEventListener('DOMContentLoaded', () => {
      const apiEndpointElement = document.getElementById('apiEndpointInfo');
      if (apiEndpointElement) {
        apiEndpointElement.textContent = `戻り先: ${API_ENDPOINT}`;
      }
      
      // バージョン情報を表示
      const versionElement = document.getElementById('versionInfo');
      if (versionElement) {
        versionElement.textContent = `v1.0.2 | デプロイ: 2025/8/18 16:30 | ${new Date().toLocaleDateString('ja-JP')}`;
      }
      
      // 開発モードの場合、テストデータをフォームに設定
      if (DEV_MODE) {
        console.log('🧪 開発モード: テストデータを設定中...');
        
        // 各フィールドにテストデータを設定
        if (document.getElementById('familyName')) {
          document.getElementById('familyName').value = TEST_DATA.familyName;
          document.getElementById('familyName').placeholder = TEST_DATA.familyName;
        }
        if (document.getElementById('firstName')) {
          document.getElementById('firstName').value = TEST_DATA.firstName;
          document.getElementById('firstName').placeholder = TEST_DATA.firstName;
        }
        if (document.getElementById('familyNameKana')) {
          document.getElementById('familyNameKana').value = TEST_DATA.familyNameKana;
          document.getElementById('familyNameKana').placeholder = TEST_DATA.familyNameKana;
        }
        if (document.getElementById('firstNameKana')) {
          document.getElementById('firstNameKana').value = TEST_DATA.firstNameKana;
          document.getElementById('firstNameKana').placeholder = TEST_DATA.firstNameKana;
        }
        if (document.getElementById('school')) {
          document.getElementById('school').value = TEST_DATA.school;
          document.getElementById('school').placeholder = TEST_DATA.school;
        }
        if (document.getElementById('grade')) {
          document.getElementById('grade').value = TEST_DATA.grade;
        }
        
        console.log('✅ テストデータ設定完了:', TEST_DATA);
      } else {
        console.log('📝 本番モード: プレースホルダーのみ表示');
        // プレースホルダーを設定
        if (document.getElementById('familyName')) {
          document.getElementById('familyName').placeholder = '山田';
        }
        if (document.getElementById('firstName')) {
          document.getElementById('firstName').placeholder = '花子';
        }
        if (document.getElementById('familyNameKana')) {
          document.getElementById('familyNameKana').placeholder = 'ヤマダ';
        }
        if (document.getElementById('firstNameKana')) {
          document.getElementById('firstNameKana').placeholder = 'ハナコ';
        }
        if (document.getElementById('school')) {
          document.getElementById('school').placeholder = '〇〇高校';
        }
      }
    });

    // LIFF設定
    const LIFF_ID = '2007366489-ZaL835MB'; // 入力フォーム (Full)
    const ENABLE_TEST_MODE = false; // 本番用設定

    // LIFF初期化
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        if (LIFF_ID !== 'YOUR_LIFF_ID') {
          await liff.init({ liffId: LIFF_ID });
          console.log('LIFF初期化完了');
        } else {
          console.log('⚠️ LIFF IDが設定されていません。LIFF_ID変数を設定してください。');
        }
      } catch (error) {
        console.log('LIFF初期化エラー:', error);
      }
    });
    
    // URLパラメータからtokenを取得しhiddenでセット
    const p     = new URLSearchParams(location.search);
    const token = p.get('tok') ?? '';
    document.addEventListener('DOMContentLoaded', () => {
      const tokenInput = document.createElement('input');
      tokenInput.type = 'hidden';
      tokenInput.name = 'token';
      tokenInput.value = token;
      document.getElementById('reserveForm').appendChild(tokenInput);
    });
    // フォーム送信
    const form   = document.getElementById('reserveForm');
    const button = document.getElementById('submitBtn');
    const spinner = document.getElementById('loadingSpinner');
    const completeMessage = document.getElementById('completeMessage');
    const completeDetail = document.getElementById('completeDetail');
    const completeOkBtn = document.getElementById('completeOkBtn');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      button.disabled = true;
      spinner.style.display = 'flex'; // スピナー表示
      const startTime = Date.now();
      console.log('送信ボタン押下:', new Date(startTime).toISOString());
      try {
        const body = {
          familyName     : form.familyName.value.trim(),
          firstName      : form.firstName.value.trim(),
          familyNameKana : form.familyNameKana.value.trim(),
          firstNameKana  : form.firstNameKana.value.trim(),
          school         : form.school.value.trim(),
          grade          : form.grade.value,
          token          : token
        };

        let debugLog = '';
        debugLog += '[送信データ]\n' + JSON.stringify(body, null, 2) + '\n\n';
        debugLog += '[APIエンドポイント]\n' + API_ENDPOINT + '\n\n';
        debugLog += '[リクエストヘッダー]\n' + JSON.stringify({ 'Content-Type': 'application/json' }, null, 2) + '\n\n';

        console.log('🌐 fetch開始:', API_ENDPOINT);
        console.log('📤 送信データ:', body);
        
        let response;
        try {
          response = await fetch(API_ENDPOINT, {
            method : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body   : JSON.stringify(body)
          });
          console.log('✅ fetch成功 - ステータス:', response.status);
        } catch (fetchError) {
          console.error('❌ fetch失敗:', fetchError);
          debugLog += '[fetchエラー詳細]\n';
          debugLog += '・エラー名: ' + fetchError.name + '\n';
          debugLog += '・エラーメッセージ: ' + fetchError.message + '\n';
          debugLog += '・エラータイプ: ' + fetchError.constructor?.name + '\n';
          if (fetchError.cause) {
            debugLog += '・原因: ' + fetchError.cause + '\n';
          }
          throw fetchError;
        }

        const endTime = Date.now();
        const elapsed = ((endTime - startTime) / 1000).toFixed(2);
        console.log('レスポンス受信:', new Date(endTime).toISOString());
        console.log('API応答時間:', elapsed + '秒');

        debugLog += '[レスポンスステータス]\n' + response.status + '\n';

        let responseText = '';
        try {
          responseText = await response.text();
          debugLog += '[レスポンス内容]\n' + responseText + '\n';
          console.log('📥 レスポンス内容:', responseText);
        } catch (e) {
          debugLog += '[レスポンス内容取得エラー]\n' + e.message + '\n';
          console.error('❌ レスポンス内容取得エラー:', e);
        }

        if (!response.ok) {
          const errorInfo = {
            status: response.status,
            statusText: response.statusText,
            responseText: responseText,
            url: API_ENDPOINT
          };
          console.error('❌ HTTPエラー:', errorInfo);
          debugLog += '[HTTPエラー詳細]\n' + JSON.stringify(errorInfo, null, 2) + '\n';
          throw new Error(`API エラー: ${response.status} - ${responseText}`);
        }

        completeDetail.textContent = 'API応答時間: ' + elapsed + '秒\n予約が完了しました。トーク画面にメッセージを送信中...';
        completeMessage.style.display = 'flex';
        
        // LINEトーク画面にメッセージを送信
        console.log('LIFF状態チェック:');
        console.log('- liff定義済み:', typeof liff !== 'undefined');
        console.log('- LIFF初期化済み:', typeof liff !== 'undefined' && liff.isReady && liff.isReady());
        console.log('- LINEクライアント内:', typeof liff !== 'undefined' && liff.isInClient && liff.isInClient());
        
        try {
          if (typeof liff !== 'undefined' && liff.isReady && liff.isReady()) {
            if (liff.isInClient()) {
              console.log('メッセージ送信開始...');
              await liff.sendMessages([
                {
                  type: 'text',
                  text: `🎉 予約が完了しました！\n\n📝 予約内容\n・氏名: ${body.familyName} ${body.firstName}\n・ヨミガナ: ${body.familyNameKana} ${body.firstNameKana}\n・学校名: ${body.school}\n・学年: ${body.grade}年\n\n⏱️ API応答時間: ${elapsed}秒\n\nありがとうございました！`
                }
              ]);
              console.log('メッセージ送信完了');
              completeDetail.textContent = 'API応答時間: ' + elapsed + '秒\nトーク画面にメッセージを送信しました。アプリを自動で閉じます...';
            } else {
              console.log('LINEクライアント外環境です');
              if (ENABLE_TEST_MODE) {
                console.log('テストモード: メッセージ送信を試行します');
                await liff.sendMessages([
                  {
                    type: 'text',
                    text: `🎉 予約が完了しました！\n\n📝 予約内容\n・氏名: ${body.familyName} ${body.firstName}\n・ヨミガナ: ${body.familyNameKana} ${body.firstNameKana}\n・学校名: ${body.school}\n・学年: ${body.grade}年\n\n⏱️ API応答時間: ${elapsed}秒\n\nありがとうございました！`
                  }
                ]);
                completeDetail.textContent = 'API応答時間: ' + elapsed + '秒\n[テストモード] メッセージ送信を試行しました。';
              } else {
                completeDetail.textContent = 'API応答時間: ' + elapsed + '秒\n予約が完了しました。（LINEクライアント外のため、メッセージ送信なし）';
              }
            }
          } else {
            console.log('LIFF未初期化またはSDK未読み込み');
            completeDetail.textContent = 'API応答時間: ' + elapsed + '秒\n予約が完了しました。（LIFF未初期化）';
          }
        } catch (messageError) {
          console.log('メッセージ送信エラー:', messageError);
          completeDetail.textContent = 'API応答時間: ' + elapsed + '秒\n予約が完了しました。（メッセージ送信エラー: ' + messageError.message + '）';
        }
        
        // 3秒後にLIFFアプリを自動で閉じる（メッセージ送信時間を考慮）
        setTimeout(() => {
          try {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
              liff.closeWindow();
            } else {
              // LIFF環境でない場合の代替処理
              console.log('LIFF環境ではありません');
            }
          } catch (error) {
            console.log('ウィンドウクローズエラー:', error);
          }
        }, 3000);
      } catch(err){
        let errorMessage = '送信に失敗しました。\n\n';
        errorMessage += '[エラー名]\n' + (err.name || 'Unknown Error') + '\n';
        errorMessage += '[エラーメッセージ]\n' + (err.message || 'No error message') + '\n';
        
        // iPhoneでもエラースタックを表示できるように改善
        if (err.stack) {
          errorMessage += '[エラースタック]\n' + err.stack + '\n';
        } else {
          errorMessage += '[エラースタック]\nスタックトレースが利用できません\n';
        }
        
        // 追加のエラー情報
        errorMessage += '[エラー詳細]\n';
        errorMessage += '・タイプ: ' + (typeof err) + '\n';
        errorMessage += '・コンストラクタ: ' + (err.constructor?.name || 'Unknown') + '\n';
        errorMessage += '・プロトタイプ: ' + (Object.getPrototypeOf(err)?.constructor?.name || 'Unknown') + '\n';
        
        // ネットワークエラーの場合の詳細情報
        if (err.name === 'TypeError' && err.message.includes('fetch')) {
          errorMessage += '・ネットワークエラーが発生しています\n';
          errorMessage += '・CORS設定を確認してください\n';
          errorMessage += '・APIエンドポイント: ' + API_ENDPOINT + '\n';
        }
        
        if (typeof debugLog !== 'undefined') {
          errorMessage += '\n[デバッグログ]\n' + debugLog;
        }
        
        errorMessage += '\n時間をおいて再度お試しください。';
        
        // アラートで表示（iPhoneでも確実に表示される）
        alert(errorMessage);
        
        // コンソールにも詳細ログを出力
        console.error('詳細エラー情報:', {
          name: err.name,
          message: err.message,
          stack: err.stack,
          constructor: err.constructor?.name,
          prototype: Object.getPrototypeOf(err)?.constructor?.name,
          type: typeof err,
          debugLog: debugLog
        });
        
        button.disabled = false;
      }
      spinner.style.display = 'none'; // スピナー非表示
    });
    completeOkBtn.addEventListener('click', () => {
      try {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
          liff.closeWindow();
        } else {
          completeMessage.style.display = 'none';
        }
      } catch (error) {
        console.log('ウィンドウクローズエラー:', error);
        completeMessage.style.display = 'none';
      }
    });
  </script>
</body>
</html>
